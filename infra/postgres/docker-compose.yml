services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger_admin
      POSTGRES_PASSWORD: local-dev-only
    ports: ["5432:5432"]
    volumes:
      - ledger_pg:/var/lib/postgresql/data
      - ./001_ledger.sql:/docker-entrypoint-initdb.d/001_ledger.sql:ro
      - ./migrations/002_service_workflows.sql:/docker-entrypoint-initdb.d/002_service_workflows.sql:ro
volumes:
  ledger_pg: {}
