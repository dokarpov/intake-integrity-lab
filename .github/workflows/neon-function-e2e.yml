name: Acorde exact Neon backend E2E
on:
  push:
    branches: ['testing/postgres-integrity-2026-10-20']
    paths:
      - 'functions/intake-staging.mjs'
      - 'src/sales-integrity/**'
      - 'demo/**'
      - 'tests/staging-neon-bridge.mjs'
      - 'tests/staging-neon-api-e2e.mjs'
      - 'tests/staging-browser-live.mjs'
      - 'tests/onboarding-browser-live.mjs'
      - '.github/workflows/neon-function-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-function-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledger
          POSTGRES_USER: ledger_admin
          POSTGRES_PASSWORD: local-dev-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledger_admin -d ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ledger_admin:local-dev-only@127.0.0.1:5432/ledger
      TEST_DATABASE_URL: postgres://ledger_admin:local-dev-only@127.0.0.1:5432/ledger
      INTAKE_MIGRATION_TARGET: staging
      INTEGRITY_PG_V2_ENABLED: 'true'
      INTEGRITY_SANDBOX_ENABLED: 'true'
      SANDBOX_EVIDENCE_HMAC_SECRET: ci-only-fictional-evidence-signing-key-48-characters-long
      INTEGRITY_FINGERPRINT_HMAC_SECRET: ci-only-fictional-hmac-fingerprint-key-40-characters
      STAGING_ACCESS_TOKEN: ci-only-fictional-neon-function-token-48-characters-long
      STAGING_FIXTURES: 'true'
      NODE_ENV: staging
      NEON_E2E_PORT: '8788'
      BASE_URL: http://127.0.0.1:8788
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact-function test dependencies
        run: |
          npm install --no-save --ignore-scripts esbuild pg@8 playwright
          npx playwright install --with-deps chromium
      - name: Prepare disposable real PostgreSQL and fictional fixtures
        run: |
          node scripts/migrate-staging.mjs --apply
          node scripts/seed-staging.mjs
      - name: Bundle same Neon Function entry used by the hosted stage
        run: |
          ./node_modules/.bin/esbuild functions/intake-staging.mjs \
            --bundle --platform=node --target=node24 --format=esm \
            --loader:.html=text \
            --banner:js="import{createRequire as ___cr}from'module';import{fileURLToPath as ___f}from'url';import{dirname as ___d}from'path';const require=___cr(import.meta.url);const __filename=___f(import.meta.url);const __dirname=___d(__filename);" \
            --outfile=/tmp/acorde-neon-e2e.mjs
          node --check /tmp/acorde-neon-e2e.mjs
      - name: Authenticated API, real DB, simulator and Chromium journeys
        run: |
          set -euo pipefail
          mkdir -p /tmp/acorde-screens
          node tests/staging-neon-bridge.mjs >/tmp/acorde-neon-bridge.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8788/readyz
          node tests/staging-neon-api-e2e.mjs
          E2E_SCREENSHOT_DIR=/tmp/acorde-screens node tests/staging-browser-live.mjs
          node tests/onboarding-browser-live.mjs
      - name: Upload verified mobile and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acorde-neon-backend-e2e-screenshots
          path: /tmp/acorde-screens/*.png
          if-no-files-found: ignore
          retention-days: 7
