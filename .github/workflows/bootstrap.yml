name: Bootstrap source release

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct release
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part.* > /tmp/release.b64
          base64 -d /tmp/release.b64 > /tmp/release.zip
          rm -f README.md
          unzip -qo /tmp/release.zip -d .
          rm -rf .bootstrap
      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release source" || exit 0
          git push
